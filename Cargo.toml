[package]
name = "rs-ltsv2sqlite"
version = "0.1.0"
edition = "2024"

description = "Convert LTSV logs to SQLite database"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-ltsv2sqlite"
homepage = "https://github.com/takanoriyanagitani/rs-ltsv2sqlite"
documentation = "https://docs.rs/rs-ltsv2sqlite/latest"
keywords = ["ltsv", "sqlite", "wasi", "convert", "json"]

exclude = [
  "ltsv2sqlite.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "ltsv2sqlite"

[dependencies.rusqlite]
version = "0.40.2"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]

[dependencies.serde_json]
version = "1.0.154"
default-features = false
features = [
  "std",
]

[dependencies.serde]
version = "1.0.229"
default-features = false
features = [
  "std",
]

[dependencies.time]
version = "0.3.55"
default-features = false
features = [
  "std",
  "parsing",
]
