[package]
name = "rs-ltsv2sqlite"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "ltsv2sqlite"

[dependencies.rusqlite]
version = "0.40.2"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]

[dependencies.serde_json]
version = "1.0.154"
default-features = false
features = [
  "std",
]

[dependencies.serde]
version = "1.0.229"
default-features = false
features = [
  "std",
]

[dependencies.time]
version = "0.3.55"
default-features = false
features = [
  "std",
  "parsing",
]
